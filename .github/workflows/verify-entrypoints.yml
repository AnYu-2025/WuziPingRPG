name: Verify entry points

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release:
    name: 已提交安装包的严格校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验入口回归
        run: python3 tools/test_verify_support.py
      - name: 纪念版游戏 APK
        run: python3 tools/verify-release.py --strict
      - name: 天工 APK
        run: python3 tools/verify-studio-release.py --strict

  web:
    name: 工作室网页与打包资源
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: 安装网页依赖
        working-directory: studio/web
        run: npm ci
      - name: 天工网页测试
        working-directory: studio/web
        run: npm test
      - name: 首页卡片静态检查
        run: node tools/test-merged-ui.js
      - name: 安装浏览器测试环境
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-browser" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/studio-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: 手机尺寸的首页、返回和焦点回归
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory studio/src/main/assets/studio > "$RUNNER_TEMP/studio-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          export STUDIO_PREVIEW_URL=http://127.0.0.1:8765/index.html
          curl --fail --silent --show-error --retry 10 --retry-connrefused "$STUDIO_PREVIEW_URL" --output /dev/null
          NODE_PATH="$RUNNER_TEMP/studio-browser/node_modules" node tools/test-merged-ui.js --browser
      - name: 网页源码、临时构建和已发布 APK 的一致性
        run: python3 tools/verify-interface-fix.py --strict

  entrypoints:
    name: 校验入口 · 工作室网页测试
    needs: [release, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总安装包和网页检查
        run: |
          test "${{ needs.release.result }}" = success
          test "${{ needs.web.result }}" = success
